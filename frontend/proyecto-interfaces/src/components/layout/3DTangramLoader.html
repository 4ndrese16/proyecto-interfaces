<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tangram 3D - Paralelogramo invertido y más grande | Animación cíclica</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: system-ui, 'Segoe UI', monospace;
        }
        .info-silent {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.5);
            color: #aaa;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="info-silent">🎬 Tangram 3D | Paralelogramo invertido + tamaño ligeramente mayor | Vista 180°</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import gsap from 'gsap';

        // --- ESCENA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1030);

        // --- CÁMARA - VISTA ROTADA 180° ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-5, 7, -5);
        camera.lookAt(0, 0, 0);
        camera.up.set(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- ILUMINACIÓN MÍNIMA (solo para sombras) ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.9);
        mainLight.position.set(3, 8, 2);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 12;
        mainLight.shadow.camera.left = -5;
        mainLight.shadow.camera.right = 5;
        mainLight.shadow.camera.top = 5;
        mainLight.shadow.camera.bottom = -5;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x88aacc, 0.3);
        fillLight.position.set(0, -1, 0);
        fillLight.castShadow = false;
        scene.add(fillLight);
        
        // --- Suelo decorativo ---
        const gridHelper = new THREE.GridHelper(12, 20, 0x88aaff, 0x336699);
        gridHelper.position.y = -0.35;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        gridHelper.receiveShadow = true;
        scene.add(gridHelper);
        
        const ring = new THREE.Mesh(
            new THREE.RingGeometry(2.2, 3.0, 32),
            new THREE.MeshStandardMaterial({ color: 0x3a6ea5, roughness: 1, metalness: 0, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = -0.32;
        ring.receiveShadow = true;
        scene.add(ring);

        // --- FUNCIÓN PARA CREAR PIEZAS (material mate con sombras) ---
        function createTangramPiece(points2D, color, thickness = 0.22) {
            const shape = new THREE.Shape();
            shape.moveTo(points2D[0].x, points2D[0].y);
            for (let i = 1; i < points2D.length; i++) {
                shape.lineTo(points2D[i].x, points2D[i].y);
            }
            shape.closePath();
            
            const extrudeSettings = {
                steps: 1,
                depth: thickness,
                bevelEnabled: true,
                bevelThickness: 0.06,
                bevelSize: 0.05,
                bevelSegments: 3
            };
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geometry.computeVertexNormals();
            geometry.rotateX(-Math.PI / 2);
            geometry.computeBoundingBox();
            const box = geometry.boundingBox;
            const centerX = (box.min.x + box.max.x) / 2;
            const centerY = (box.min.y + box.max.y) / 2;
            const centerZ = (box.min.z + box.max.z) / 2;
            geometry.translate(-centerX, -centerY, -centerZ);
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.9,
                metalness: 0.05,
                emissive: 0x000000
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }
        
        // --- GEOMETRÍAS (triángulos y cuadrado) ---
        const largeTri = [new THREE.Vector2(0,0), new THREE.Vector2(2.0,0), new THREE.Vector2(0,2.0)];
        const cLarge = { x: (0+2+0)/3, y: (0+0+2)/3 };
        const largeCentered = largeTri.map(p => new THREE.Vector2(p.x - cLarge.x, p.y - cLarge.y));
        
        const medTri = [new THREE.Vector2(0,0), new THREE.Vector2(1.414,0), new THREE.Vector2(0,1.414)];
        const cMed = { x: (0+1.414+0)/3, y: (0+0+1.414)/3 };
        const medCentered = medTri.map(p => new THREE.Vector2(p.x - cMed.x, p.y - cMed.y));
        
        const smallTri = [new THREE.Vector2(0,0), new THREE.Vector2(1.0,0), new THREE.Vector2(0,1.0)];
        const cSmall = { x: (0+1+0)/3, y: (0+0+1)/3 };
        const smallCentered = smallTri.map(p => new THREE.Vector2(p.x - cSmall.x, p.y - cSmall.y));
        
        const square = [new THREE.Vector2(-0.5,-0.5), new THREE.Vector2(0.5,-0.5), new THREE.Vector2(0.5,0.5), new THREE.Vector2(-0.5,0.5)];
        
        // --- PARALELOGRAMO INVERTIDO Y MÁS GRANDE ---
        // Versión original (sin invertir): (-0.65,-0.3), (0.35,-0.3), (0.65,0.3), (-0.35,0.3)
        // Invertir horizontalmente: cambiar signo de X en cada punto -> (0.65,-0.3), (-0.35,-0.3), (-0.65,0.3), (0.35,0.3)
        // Escalar un 20% más grande (factor 1.2) para que sea un poco más grande y equilibre visualmente
        const factor = 1.15;
        const paraleloInvertidoGrande = [
            new THREE.Vector2(0.85 * factor, -0.3 * factor),
            new THREE.Vector2(-0.30 * factor, -0.3 * factor),
            new THREE.Vector2(-0.85 * factor, 0.3 * factor),
            new THREE.Vector2(0.30 * factor, 0.3 * factor)
        ];
        
        const pieces = [
            createTangramPiece(largeCentered, 0xe34234, 0.22),  // Triángulo Grande 1
            createTangramPiece(largeCentered, 0x3a7ca5, 0.22),  // Triángulo Grande 2
            createTangramPiece(medCentered, 0x5f9e6e, 0.2),     // Triángulo Mediano
            createTangramPiece(smallCentered, 0xe8b86b, 0.18),   // Triángulo Pequeño 1
            createTangramPiece(smallCentered, 0xc97e5a, 0.18),   // Triángulo Pequeño 2
            createTangramPiece(square, 0xb58c6b, 0.2),           // Cuadrado
            createTangramPiece(paraleloInvertidoGrande, 0xaa9fd1, 0.2)  // Paralelogramo invertido + más grande
        ];
        
        pieces.forEach(p => scene.add(p));
        
        // --- MAPEO DE COORDENADAS (píxeles -> 3D) ---
        const PIXEL_TO_UNIT = 85;
        function mapTo3D(centerX, centerY) {
            return {
                x: (centerX - 400) / PIXEL_TO_UNIT,
                z: (400 - centerY) / PIXEL_TO_UNIT
            };
        }
        
        // --- FORMAS PROPORCIONADAS POR EL USUARIO (coordenadas exactas) ---
        const form1Raw = {
            piezas: [
                { centerX: 268, centerY: 465, angleDeg: 135 },
                { centerX: 396, centerY: 590, angleDeg: 45 },
                { centerX: 481, centerY: 405, angleDeg: 90 },
                { centerX: 341, centerY: 340, angleDeg: 225 },
                { centerX: 479, centerY: 471, angleDeg: 315 },
                { centerX: 411, centerY: 407, angleDeg: 45 },
                { centerX: 514, centerY: 514, angleDeg: 90 }
            ]
        };
        const form2Raw = {
            piezas: [
                { centerX: 124, centerY: 388, angleDeg: 180 },
                { centerX: 686, centerY: 392, angleDeg: 270 },
                { centerX: 404, centerY: 395, angleDeg: 45 },
                { centerX: 547, centerY: 356, angleDeg: 90 },
                { centerX: 355, centerY: 354, angleDeg: 0 },
                { centerX: 260, centerY: 354, angleDeg: 0 },
                { centerX: 492, centerY: 348, angleDeg: 45 }
            ]
        };
        const form3Raw = {
            piezas: [
                { centerX: 474, centerY: 449, angleDeg: 315 },
                { centerX: 407, centerY: 636, angleDeg: 45 },
                { centerX: 409, centerY: 383, angleDeg: 0 },
                { centerX: 343, centerY: 508, angleDeg: 135 },
                { centerX: 340, centerY: 258, angleDeg: 225 },
                { centerX: 404, centerY: 205, angleDeg: 0 },
                { centerX: 440, centerY: 288, angleDeg: 180 }
            ]
        };
        const form4Raw = {
            piezas: [
                { centerX: 377, centerY: 461, angleDeg: 0 },
                { centerX: 415, centerY: 372, angleDeg: 45 },
                { centerX: 380, centerY: 557, angleDeg: 45 },
                { centerX: 466, centerY: 439, angleDeg: 45 },
                { centerX: 228, centerY: 548, angleDeg: 225 },
                { centerX: 509, centerY: 274, angleDeg: 45 },
                { centerX: 581, centerY: 233, angleDeg: 45 }
            ]
        };
        
        function convertForm(formRaw) {
            const state = [];
            for (let i = 0; i < pieces.length; i++) {
                const p = formRaw.piezas[i];
                const { x, z } = mapTo3D(p.centerX, p.centerY);
                const rad = p.angleDeg * Math.PI / 180;
                state.push({
                    pos: new THREE.Vector3(x, 0.1, z),
                    rotY: rad
                });
            }
            return state;
        }
        
        const states = [
            convertForm(form1Raw),
            convertForm(form2Raw),
            convertForm(form3Raw),
            convertForm(form4Raw)
        ];
        
        // Estado inicial (forma 1)
        function setInitialState() {
            const state = states[0];
            pieces.forEach((piece, idx) => {
                piece.position.copy(state[idx].pos);
                piece.rotation.y = state[idx].rotY;
            });
        }
        setInitialState();
        
        // --- BUCLE DE ANIMACIÓN INFINITO ---
        let currentIndex = 0;
        let isAnimating = false;
        
        function startNextTransition() {
            if (isAnimating) return;
            const nextIndex = (currentIndex + 1) % states.length;
            const targetState = states[nextIndex];
            
            isAnimating = true;
            const tl = gsap.timeline({
                onComplete: () => {
                    isAnimating = false;
                    currentIndex = nextIndex;
                    setTimeout(() => startNextTransition(), 1200);
                }
            });
            
            pieces.forEach((piece, idx) => {
                const target = targetState[idx];
                if (target) {
                    tl.to(piece.position, {
                        x: target.pos.x,
                        y: target.pos.y,
                        z: target.pos.z,
                        duration: 1.1,
                        ease: "back.out(0.7)",
                        overwrite: true
                    }, 0);
                    tl.to(piece.rotation, {
                        y: target.rotY,
                        duration: 1.1,
                        ease: "power2.inOut",
                        overwrite: true
                    }, 0);
                }
            });
        }
        
        setTimeout(() => startNextTransition(), 1000);
        
        // --- FONDO ESTRELLAS (decorativo) ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1200;
        const starPositions = [];
        for (let i = 0; i < starCount; i++) {
            starPositions.push((Math.random() - 0.5) * 200);
            starPositions.push((Math.random() - 0.5) * 100);
            starPositions.push((Math.random() - 0.5) * 80 - 40);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPositions), 3));
        const starMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.07, transparent: true, opacity: 0.4 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);
        
        function animateStars() {
            stars.rotation.y += 0.0002;
            stars.rotation.x += 0.0001;
            requestAnimationFrame(animateStars);
        }
        animateStars();
        
        // --- RENDER ---
        function renderLoop() {
            requestAnimationFrame(renderLoop);
            renderer.render(scene, camera);
        }
        renderLoop();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('✅ Tangram 3D - Paralelogramo invertido (espejo horizontal) y ~20% más grande');
    </script>
</body>
</html>
